name: Update cotton prices and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # 09:30 Asia/Shanghai every day
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch latest prices
        run: python update_prices.py
      - name: Export static H5
        run: python export_static.py
      - name: Generate daily WeChat article preview
        run: python email_daily_update.py --preview daily-email
      - name: Email daily article
        if: github.event_name != 'push'
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: gmw126@126.com
        run: |
          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_AUTH_CODE" ]; then
            echo "::warning::SMTP secrets are not configured; daily email skipped."
            exit 0
          fi
          python email_daily_update.py --send
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
