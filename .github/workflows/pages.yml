name: Update cotton prices and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Monday-Friday 21:00 Asia/Shanghai: daily report
    - cron: "0 13 * * 1-5"
    # Saturday 09:00 Asia/Shanghai: weekly report; Sunday rests
    - cron: "0 1 * * 6"
  workflow_dispatch:
    inputs:
      report_type:
        description: Report type for a manual run
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Select report type
        id: report
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_REPORT_TYPE: ${{ inputs.report_type }}
        run: |
          if [ "$EVENT_SCHEDULE" = "0 1 * * 6" ] || [ "$MANUAL_REPORT_TYPE" = "weekly" ]; then
            echo "type=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "type=daily" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch latest prices
        run: python update_prices.py
      - name: Export static H5
        run: python export_static.py
      - name: Generate WeChat report preview
        run: python email_daily_update.py --report-type "${{ steps.report.outputs.type }}" --preview report-email
      - name: Email report
        if: github.event_name != 'push'
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_AUTH_CODE" ] || [ -z "$MAIL_TO" ]; then
            echo "::warning::Email secrets are not configured; report email skipped."
            exit 0
          fi
          python email_daily_update.py --report-type "${{ steps.report.outputs.type }}" --send
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
